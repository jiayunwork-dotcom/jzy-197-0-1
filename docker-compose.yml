services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recon
      POSTGRES_USER: recon
      POSTGRES_PASSWORD: recon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recon -d recon"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      RECON_DB_DSN: "postgresql://recon:recon@db:5432/recon"
      FLASK_DEBUG: "0"
    ports:
      - "8000:8000"

volumes:
  pgdata:
